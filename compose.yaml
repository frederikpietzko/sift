services:
  postgres:
    image: postgres:17-alpine
    container_name: sift-postgres
    environment:
      POSTGRES_DB: sift
      POSTGRES_USER: sift
      POSTGRES_PASSWORD: sift
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sift -d sift" ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: sift-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sift
      RABBITMQ_DEFAULT_PASS: sift
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    # Local OAuth2/OIDC provider for the server (issuer http://localhost:8180/realms/sift). The `sift`
    # realm (public PKCE client `sift-web`, users dev/dev and e2e/e2e) is imported on every start.
    image: quay.io/keycloak/keycloak:26.5
    container_name: sift-keycloak
    command: [ "start-dev", "--import-realm", "--health-enabled=true" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8080"
    ports:
      - "8180:8080"
    volumes:
      - ./config/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image ships no curl/wget; probe the management port's readiness endpoint via bash /dev/tcp.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  searxng:
    image: searxng/searxng
    container_name: sift-searxng
    environment:
      SEARXNG_BASE_URL: http://localhost:8888/
    ports:
      - "8888:8080"
    volumes:
      - ./config/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  postgres-data:
  rabbitmq-data:
