spring:
  application:
    name: sift-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sift}
    username: ${SPRING_DATASOURCE_USERNAME:sift}
    password: ${SPRING_DATASOURCE_PASSWORD:sift}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:sift}
    password: ${SPRING_RABBITMQ_PASSWORD:sift}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}
    connection-timeout: 5s
    template:
      retry:
        enabled: true
        initial-interval: 1s
        multiplier: 2.0
        max-retries: 3
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Any OIDC provider; the JWKS is discovered from the issuer. Defaults point at the Compose Keycloak realm.
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/sift}
          # Expected `aud` claim; set to an empty value to disable the audience check.
          audiences: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES:sift-server}
  exposed:
    generate-ddl: false
    show-sql: false
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
    async:
      # SSE watch streams are open-ended; the container must not time out async requests.
      request-timeout: -1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

sift:
  server:
    namespace: ${SIFT_SERVER_NAMESPACE:sift-dev}
    encryption-key: ${SIFT_SERVER_ENCRYPTION_KEY}
    auth:
      # Public PKCE client the web client authenticates as; exposed through GET /api/v1/auth/config.
      client-id: ${SIFT_SERVER_AUTH_CLIENT_ID:sift-web}
      scopes: ${SIFT_SERVER_AUTH_SCOPES:openid,profile,email}
      claims:
        username: ${SIFT_SERVER_AUTH_CLAIMS_USERNAME:preferred_username}
        email: ${SIFT_SERVER_AUTH_CLAIMS_EMAIL:email}
