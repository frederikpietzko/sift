apiVersion: v1
kind: ServiceAccount
metadata:
  name: sift-server
  namespace: sift-dev
  labels:
    app.kubernetes.io/managed-by: sift-local-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sift-server
  namespace: sift-dev
  labels:
    app.kubernetes.io/managed-by: sift-local-dev
rules:
  - apiGroups: [sift.org]
    resources: [codereviews]
    verbs: [get, list, create, delete]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sift-server
  namespace: sift-dev
  labels:
    app.kubernetes.io/managed-by: sift-local-dev
subjects:
  - kind: ServiceAccount
    name: sift-server
    namespace: sift-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sift-server
