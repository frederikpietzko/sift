# Additional host-operator configuration, never the agent's local profile.
# The host-run operator publishes CodeReview status events to the compose.yaml RabbitMQ on localhost;
# the password comes from SPRING_RABBITMQ_PASSWORD in the operator's environment (see dev.py run).
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: sift
    virtual-host: /
sift:
  operator:
    namespace: sift-dev
    services:
      model-base-url: 'http://jb-central:19516/wire/{proxyToken}/codex/openai/v1'
      model: gpt-5.6-luna
      searxng-url: http://searxng:8888
      rabbitmq-host: rabbitmq
      rabbitmq-port: 5672
      rabbitmq-username: sift
      rabbitmq-virtual-host: /
    secrets:
      model-api-key: {name: sift-local-credentials, key: model-api-key}
      proxy-token: {name: sift-local-credentials, key: proxy-token}
      rabbitmq-password: {name: sift-local-credentials, key: rabbitmq-password}