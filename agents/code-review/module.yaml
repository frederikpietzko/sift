product: jvm/app
apply:
  - //config/detekt.module-template.yaml
  - //config/spring.module-template.yaml

settings:
  jvm:
    mainClass: org.sift.agents.review.MainKt
    # Spring Boot defaults to classes mode for DevTools restarts, but that packages
    # local module outputs as BOOT-INF/lib directories the Boot loader cannot load
    # (KTC-5686). Jars mode is required for a startable executable-jar.
    runtimeClasspathMode: jars

dependencies:
  - $spring.boot.starter
  - bom: $libs.spring.ai.bom
  - $libs.spring.ai.openai.starter
  - $libs.spring.ai.community.agent.utils
  - $libs.jackson.module.kotlin
  - //agents/shared
  - //events

test-dependencies:
  - $spring.boot.starter.test
  - $libs.mockk
  - $libs.springmockk