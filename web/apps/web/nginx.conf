# nginx server block for the `sift-web` image (nginxinc/nginx-unprivileged, listens on 8080 as uid 101).
#
# Installed as /etc/nginx/templates/default.conf.template: the image entrypoint runs envsubst over it on
# start (restricted by NGINX_ENVSUBST_FILTER to the variables named below, so nginx's own `$uri`/`$host` stay
# untouched) and writes /tmp/default.conf, which the main nginx.conf includes (see the Dockerfile).
# `SIFT_SERVER_UPSTREAM` (default http://sift-server:8080, i.e. the `sift-server` Service) is the only knob;
# `NGINX_LOCAL_RESOLVERS` (the nameservers of /etc/resolv.conf, exported by the image entrypoint because the
# Dockerfile sets NGINX_ENTRYPOINT_LOCAL_RESOLVERS) lets nginx resolve the upstream at request time, so it
# starts — and the Pod becomes ready — even while the server Service does not exist yet.
#
# Responsibilities: serve the SPA with history fallback, proxy the same-origin `/api/` (REST + SSE) and the
# OpenAPI description to the server without buffering, cache hashed assets aggressively.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    absolute_redirect off;

    # Runtime resolution of the upstream host (see the `set $sift_upstream` indirection below).
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    resolver_timeout 5s;
    set $sift_upstream ${SIFT_SERVER_UPSTREAM};

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Probe target for the Deployment; never proxied, never logged.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Same-origin API: REST and the `GET /api/v1/agents/watch` Server-Sent Events stream. Buffering is off and
    # the read timeout is long so idle streams survive between the server's 15s `:heartbeat` frames; the
    # server does not set an async request timeout either (spring.mvc.async.request-timeout=-1).
    location /api/ {
        proxy_pass $sift_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding on;
    }

    # OpenAPI contract (anonymous on the server), handy for plugin authors pointing at a deployment.
    location /v3/api-docs {
        proxy_pass $sift_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed files under /assets; they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # SPA history fallback: every unknown path is a client-side route and gets index.html (uncached so a new
    # deployment is picked up on the next navigation).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }
}
